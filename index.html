<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FM Halftone</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scroll::-webkit-scrollbar-track {
      background: #0f172a;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>

<body
  class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-sky-500 selection:text-slate-950">

  <header
    class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 px-4 sm:px-6 py-3 flex items-center justify-between">
    <h1 class="text-base font-medium tracking-tight text-slate-200">
      FM Halftone
    </h1>
    <div id="status" class="text-xs text-slate-400 font-mono flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
      Ready
    </div>
  </header>

  <main
    class="flex-1 max-w-[1920px] w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-[320px_1fr] xl:grid-cols-[360px_1fr] gap-6">

    <aside class="flex flex-col gap-4 order-2 lg:order-1">

      <section class="bg-slate-900 border border-slate-800 rounded-lg p-4 shadow-sm">
        <div id="dropzone"
          class="border-2 border-dashed border-slate-700 hover:border-sky-400/80 bg-slate-950/50 hover:bg-sky-500/5 rounded-lg p-5 text-center cursor-pointer transition-all duration-200">
          <p class="text-sm font-medium text-slate-300">Drag & Drop Image</p>
          <p class="text-xs text-slate-500 mt-1">or click to upload</p>
          <input type="file" id="fileInput" accept="image/*" class="hidden">
        </div>
      </section>

      <section class="bg-slate-900 border border-slate-800 rounded-lg p-4 shadow-sm">
        <div class="grid grid-cols-2 gap-2 font-mono">
          <div class="bg-slate-950/60 p-2.5 rounded border border-slate-800/50">
            <div class="text-[10px] uppercase text-slate-500">Resolution</div>
            <div id="metricRes" class="text-xs font-semibold text-sky-400 mt-0.5">0x0</div>
          </div>
          <div class="bg-slate-950/60 p-2.5 rounded border border-slate-800/50">
            <div class="text-[10px] uppercase text-slate-500">Time</div>
            <div id="metricTime" class="text-xs font-semibold text-sky-400 mt-0.5">0 ms</div>
          </div>
        </div>
      </section>

      <button id="downloadBtn" disabled
        class="w-full py-2.5 px-4 bg-sky-500 hover:bg-sky-400 disabled:opacity-40 disabled:hover:bg-sky-500 disabled:cursor-not-allowed text-slate-950 font-semibold rounded-lg text-sm transition-all shadow-sm active:scale-[0.99]">
        Export PNG
      </button>
    </aside>

    <section class="flex flex-col gap-4 order-1 lg:order-2 min-h-[500px] lg:min-h-0">
      <div
        class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 flex items-center justify-between gap-3 shadow-sm">
        <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-md border border-slate-800">
          <button id="btnViewOutput"
            class="px-3 py-1 text-xs font-medium rounded bg-sky-500 text-slate-950 transition-all shadow-sm">Output</button>
          <button id="btnViewInput"
            class="px-3 py-1 text-xs font-medium rounded text-slate-400 hover:text-slate-200 transition-all">Original</button>
        </div>
        <div id="resolutionTag" class="text-xs font-mono text-slate-400 pr-1">No Image Loaded</div>
      </div>

      <div
        class="flex-1 bg-slate-950 border border-slate-800 rounded-lg overflow-hidden relative flex items-center justify-center p-4 min-h-[400px]">
        <div class="custom-scroll max-w-full max-h-full overflow-auto flex items-center justify-center">
          <canvas id="outputCanvas" class="hidden max-w-full max-h-[75vh] object-contain shadow-xl rounded"></canvas>

          <div id="emptyState" class="text-center text-slate-500 p-8 space-y-2">
            <p class="text-sm font-medium">Upload an image to render</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const FS_W7 = 7.0 / 16.0;
    const FS_W3 = 3.0 / 16.0;
    const FS_W5 = 5.0 / 16.0;
    const FS_W1 = 1.0 / 16.0;

    let rawImage = null;
    let originalImageData = null;
    let processedImageData = null;

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const emptyState = document.getElementById('emptyState');
    const downloadBtn = document.getElementById('downloadBtn');

    const metricRes = document.getElementById('metricRes');
    const metricTime = document.getElementById('metricTime');
    const statusText = document.getElementById('status');
    const resolutionTag = document.getElementById('resolutionTag');

    const btnViewOutput = document.getElementById('btnViewOutput');
    const btnViewInput = document.getElementById('btnViewInput');

    let currentView = 'output';

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', handleFileSelect);

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('border-sky-400', 'bg-sky-500/10');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('border-sky-400', 'bg-sky-500/10');
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('border-sky-400', 'bg-sky-500/10');
      if (e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        handleFileSelect();
      }
    });

    btnViewOutput.addEventListener('click', () => setView('output'));
    btnViewInput.addEventListener('click', () => setView('input'));
    downloadBtn.addEventListener('click', exportImage);

    function setView(view) {
      currentView = view;
      if (view === 'output') {
        btnViewOutput.className = "px-3 py-1 text-xs font-medium rounded bg-sky-500 text-slate-950 transition-all shadow-sm";
        btnViewInput.className = "px-3 py-1 text-xs font-medium rounded text-slate-400 hover:text-slate-200 transition-all";
        if (processedImageData) ctx.putImageData(processedImageData, 0, 0);
      } else {
        btnViewInput.className = "px-3 py-1 text-xs font-medium rounded bg-sky-500 text-slate-950 transition-all shadow-sm";
        btnViewOutput.className = "px-3 py-1 text-xs font-medium rounded text-slate-400 hover:text-slate-200 transition-all";
        if (originalImageData) ctx.putImageData(originalImageData, 0, 0);
      }
    }

    function handleFileSelect() {
      const file = fileInput.files[0];
      if (!file) return;

      statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Loading...`;
      const reader = new FileReader();

      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          rawImage = img;
          canvas.width = img.width;
          canvas.height = img.height;

          ctx.drawImage(img, 0, 0);
          originalImageData = ctx.getImageData(0, 0, img.width, img.height);

          emptyState.classList.add('hidden');
          canvas.classList.remove('hidden');
          downloadBtn.disabled = false;

          metricRes.textContent = `${img.width}x${img.height}`;
          resolutionTag.textContent = `${img.width} × ${img.height} PX`;

          triggerProcess();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    const waitForNextPaint = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    async function triggerProcess() {
      if (!originalImageData) return;
      statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span> Processing...`;

      await waitForNextPaint();

      const startTime = performance.now();
      processHalftone();
      const endTime = performance.now();

      const duration = (endTime - startTime).toFixed(1);
      metricTime.textContent = `${duration} ms`;
      statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> Ready`;

      setView(currentView);
    }

    function processHalftone() {
      const w = originalImageData.width;
      const h = originalImageData.height;
      const srcPix = originalImageData.data;

      const buf = new Float64Array(w * h);

      for (let i = 0; i < srcPix.length; i += 4) {
        const r = srcPix[i];
        const g = srcPix[i + 1];
        const b = srcPix[i + 2];
        const a = srcPix[i + 3];

        const idx = i >> 2;

        if (a === 0) {
          buf[idx] = 1.0;
          continue;
        }

        const gray = (0.299 * r + 0.587 * g + 0.114 * b) / 255.0;
        const alphaNorm = a / 255.0;
        buf[idx] = gray * alphaNorm + (1.0 - alphaNorm);
      }

      processedImageData = ctx.createImageData(w, h);
      const dstPix = processedImageData.data;

      for (let y = 0; y < h; y++) {
        const yOffset = y * w;
        const nextYOffset = (y + 1) * w;
        const hasNextRow = (y + 1) < h;

        if (y % 2) for (let x = w - 1; x >= 0; x--) {
          const idx = yOffset + x;
          const oldVal = buf[idx];

          const isWhite = oldVal > 0.5;
          const newVal = isWhite ? 1.0 : 0.0;
          const pixelVal = isWhite ? 255 : 0;

          const pixIdx = idx << 2;
          dstPix[pixIdx] = pixelVal;
          dstPix[pixIdx + 1] = pixelVal;
          dstPix[pixIdx + 2] = pixelVal;
          dstPix[pixIdx + 3] = 255;

          const err = oldVal - newVal;

          if (x - 1 >= 0) buf[idx - 1] += err * FS_W7;
          if (hasNextRow) {
            if (x + 1 < w) buf[nextYOffset + x + 1] += err * FS_W3;
            buf[nextYOffset + x] += err * FS_W5;
            if (x - 1 >= 0) buf[nextYOffset + x - 1] += err * FS_W1;
          }
        } else for (let x = 0; x < w; x++) {
          const idx = yOffset + x;
          const oldVal = buf[idx];

          const isWhite = oldVal > 0.5;
          const newVal = isWhite ? 1.0 : 0.0;
          const pixelVal = isWhite ? 255 : 0;

          const pixIdx = idx << 2;
          dstPix[pixIdx] = pixelVal;
          dstPix[pixIdx + 1] = pixelVal;
          dstPix[pixIdx + 2] = pixelVal;
          dstPix[pixIdx + 3] = 255;

          const err = oldVal - newVal;

          if (x + 1 < w) buf[idx + 1] += err * FS_W7;
          if (hasNextRow) {
            if (x > 0) buf[nextYOffset + x - 1] += err * FS_W3;
            buf[nextYOffset + x] += err * FS_W5;
            if (x + 1 < w) buf[nextYOffset + x + 1] += err * FS_W1;
          }
        }
      }
    }

    function exportImage() {
      if (!processedImageData) return;

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = processedImageData.width;
      tempCanvas.height = processedImageData.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.putImageData(processedImageData, 0, 0);

      const link = document.createElement('a');
      link.download = 'halftone.png';
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>

</html>
